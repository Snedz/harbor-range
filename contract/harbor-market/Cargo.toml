[package]
name = "harbor-market"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Grid Fleet Harbor Market NEP-245 sketch (testnet only)"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = { version = "=5.5.0", features = ["legacy"] }
near-sys = "=0.2.6"
borsh = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"

[workspace]
